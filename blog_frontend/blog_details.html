<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Details | BlogSpace</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="blog-details-container">
        <a href="dashboard.html" class="back-button">
            ← Back to Dashboard
        </a>

        <article class="blog-details-card">
            <p id="detailCategory" class="blog-category">Category</p>

            <h1 id="detailTitle">Blog Title</h1>

            <div class="blog-meta">
                <span id="detailAuthor">Author</span>
                <span id="detailDate">Publication Date</span>
            </div>

            <hr>

            <div id="detailContent" class="blog-full-content">
                Blog content will appear here.
            </div>
        </article>
    </main>

    <script src="script.js"></script>
</body>
</html>
